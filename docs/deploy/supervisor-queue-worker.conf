; Supervisor config — queue worker cho RenewLogictics
;
; Cài đặt:
;   sudo cp docs/deploy/supervisor-queue-worker.conf /etc/supervisor/conf.d/renewlogictics-worker.conf
;   (sửa command path + user cho đúng server)
;   sudo supervisorctl reread && sudo supervisorctl update
;
; Sau mỗi lần deploy code: php artisan queue:restart
; Xem thêm: docs/QUEUE_OPERATIONS.md

[program:renewlogictics-worker]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/RenewLogictics/artisan queue:work database --sleep=3 --tries=3 --backoff=10 --max-time=3600
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
; Đổi theo user chạy web trên server (www-data / nginx / forge...)
user=www-data
; Push FCM nhẹ — 1 process là đủ; tăng numprocs nếu sau này queue thêm việc nặng
numprocs=1
redirect_stderr=true
stdout_logfile=/var/www/RenewLogictics/storage/logs/queue-worker.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
stopwaitsecs=60
